# ============================================================
# rule-16:  IPS - Critical Severity Alert (Severity 1)
# ============================================================
name: OPNsense - IPS Critical Severity Alert (Severity 1)
type: any

index: opnsense-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

timeframe:
  minutes: 5

filter:
  - query:
      query_string:
        query: 'event.module: "suricata" AND event.severity: 1'

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":sos:"
slack_msg_color: "danger"

alert_subject: "[CRITICAL] Suricata Severity 1 Alert - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - rule.name
  - "@timestamp"

alert_text: |
  🚨 SOC ALERT: CRITICAL SEVERITY 1 IPS EVENT
  ════════════════════════════════════
  Rule      : OPNsense - IPS Critical Severity Alert (Severity 1)
  Risk Score: 99 / 100 | Severity: CRITICAL
  ────────────────────────────────────
  Source IP  : {0}
  Target IP  : {1}
  Signature  : {2}
  Timestamp  : {3}
  ────────────────────────────────────
  NOTE: Severity 1 = exploit confirmation, known malware C2, or ransomware pattern.
  ────────────────────────────────────
  IMMEDIATE RESPONSE:
  1. Block source IP immediately
  2. Research rule.name signature for context
  3. Isolate affected systems from the network
  4. Escalate to Incident Response team

realert:
  minutes: 15

exponential_realert:
  hours: 2
