# ============================================================
# opnsense-ips-c2-001: IPS - C2 or Trojan Traffic Detected
# ============================================================
name: OPNsense - IPS C2 or Trojan Traffic Detected
type: any

index: opnsense-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

timeframe:
  minutes: 15

filter:
  - query:
      query_string:
        query: 'event.module: "suricata" AND (rule.category: "A Network Trojan was Detected" OR rule.name: *trojan* OR rule.name: *C2* OR rule.name: *Reverse* OR rule.name: *beacon* OR rule.name: *RAT*)'

alert:
  - email
  - slack
  - telegram

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":skull:"
slack_msg_color: "danger"

alert_subject: "[CRITICAL] C2 / Trojan Traffic Detected - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - rule.name
  - dns.question.name
  - "@timestamp"

alert_text: |
  🚨 SOC ALERT: C2 / TROJAN TRAFFIC DETECTED
  ════════════════════════════════════
  Rule      : OPNsense - IPS C2 or Trojan Traffic Detected
  Risk Score: 99 / 100 | Severity: CRITICAL
  ────────────────────────────────────
  Source IP  : {0}
  Dest IP    : {1}
  Signature  : {2}
  DNS Query  : {3}
  Timestamp  : {4}
  ────────────────────────────────────
  MITRE ATT&CK: T1071 (Application Layer Protocol) | TA0011 (Command and Control)
  ────────────────────────────────────
  IMMEDIATE RESPONSE:
  1. Block BOTH source.ip and destination.ip on the firewall
  2. Check LAN hosts for signs of compromise
  3. Inspect DNS queries: dns.question.name field
  4. Isolate affected host from the network immediately
  5. Escalate to Incident Response team

realert:
  minutes: 15

exponential_realert:
  hours: 2