# ============================================================
# rule-15:  IPS - Brute Force on Management UI (port 8080)
# ============================================================
name: OPNsense - IPS Brute Force on Management UI (port 8080)
type: frequency

index: opnsense-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

num_events: 10
timeframe:
  minutes: 5

filter:
  - query:
      query_string:
        query: 'destination.port: 8080 AND (event.module: "suricata" OR event.module: "opnsense")'

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":lock:"
slack_msg_color: "danger"

alert_subject: "[HIGH] Brute Force on OPNsense Management UI - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - num_matches
  - "@timestamp"

alert_text: |
  🔴 SOC ALERT: BRUTE FORCE ON MANAGEMENT UI
  ════════════════════════════════════
  Rule      : OPNsense - Brute Force on Management UI (port 8080)
  Risk Score: 73 / 100 | Severity: HIGH
  ────────────────────────────────────
  Source IP  : {0}
  Port       : 8080 (OPNsense Web UI)
  Event Count: {1} requests in 5 minutes
  Timestamp  : {2}
  ────────────────────────────────────
  MITRE ATT&CK: T1110 (Brute Force) | TA0006 (Credential Access)
  ────────────────────────────────────
  IMMEDIATE RESPONSE:
  1. Manually block source IP: Firewall > Rules > WAN > Block source.ip
  2. Review OPNsense logs: System > Log Files > General
  3. Check for any successful logins in the UI
  4. Consider restricting port 8080 to trusted IPs only

realert:
  minutes: 30

exponential_realert:
  hours: 2