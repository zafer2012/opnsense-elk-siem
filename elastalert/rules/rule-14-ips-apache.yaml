# ============================================================
# rule-14:  IPS - Web Application Attack on Apache
# ============================================================
name: OPNsense - IPS Web Application Attack on Apache
type: any

index: opnsense-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

timeframe:
  minutes: 10

filter:
  - query:
      query_string:
        query: 'event.module: "suricata" AND destination.port: 80 AND (rule.category: "Web Application Attack" OR rule.name: *LFI* OR rule.name: *RFI* OR rule.name: *traversal* OR rule.name: *shellshock* OR rule.name: *XSS*)'


alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":rotating_light:"
slack_msg_color: "danger"

alert_subject: "[HIGH] Web Application Attack on Apache - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - rule.name
  - "@timestamp"

alert_text: |
  🔴 SOC ALERT: WEB APPLICATION ATTACK ON APACHE
  ════════════════════════════════════
  Rule      : OPNsense - IPS Web Application Attack on Apache
  Risk Score: 73 / 100 | Severity: HIGH
  ────────────────────────────────────
  Source IP  : {0}
  Target IP  : {1}  (Port 80 / Apache)
  Attack Vector: {2}
  Timestamp  : {3}
  ────────────────────────────────────
  MITRE ATT&CK: T1190 (Exploit Public-Facing Application)
  ────────────────────────────────────
  PREREQUISITE: WAN:80 -> LAN Apache:80 port forwarding must be active.
  ────────────────────────────────────
  RESPONSE STEPS:
  1. Identify attack vector from rule.name (LFI / RFI / XSS / Shellshock)
  2. Review Apache access logs: /var/log/apache2/access.log
  3. Check source.ip on VirusTotal / AbuseIPDB
  4. Block source IP on OPNsense firewall if malicious

realert:
  minutes: 45

exponential_realert:
  hours: 4