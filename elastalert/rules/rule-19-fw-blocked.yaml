# ============================================================
# opnsense-fw-blocked-001: Firewall - Block Action Detected
# ============================================================
name: OPNsense - Firewall Block Action Detected
type: any

index: opnsense-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

timeframe:
  minutes: 5

filter:
  - query:
      query_string:
        query: 'event.module: "opnsense" AND event.action: "block"'

alert:
  - email
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"


# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":shield:"
slack_msg_color: "good"

alert_subject: "[LOW] Firewall Block Action Detected - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - destination.port
  - rule.id
  - "@timestamp"

alert_text: |
  🟢 SOC INFO: FIREWALL BLOCK ACTION
  ════════════════════════════════════
  Rule      : OPNsense - Firewall Block Action Detected
  Risk Score: 21 / 100 | Severity: LOW
  ────────────────────────────────────
  Source     : filterlog (pf firewall) — NOT Suricata
  Source IP  : {0}
  Target IP  : {1}
  Target Port: {2}
  PF Rule ID : {3}
  Timestamp  : {4}
  ────────────────────────────────────
  NOTE: This is standard firewall deny rule activity.
  ────────────────────────────────────
  REVIEW STEPS:
  1. Check rule.id to identify which pf rule triggered
  2. Verify source.ip and destination.port for context
  3. Investigate if volume is unexpectedly high

realert:
  minutes: 60

exponential_realert:
  hours: 8