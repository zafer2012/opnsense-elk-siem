name: OPNsense - DDoS Traffic Flood
type: frequency
index: opnsense-syslog-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

num_events: 500
timeframe:
  minutes: 1

#query_key: destination.ip.keyword
query_key: destination.ip


filter:
- query:
    query_string:
      query: >
        event.dataset:"opnsense.filterlog"
        AND destination.ip:*
        AND source.ip:*
        AND NOT source.ip:(
          10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16
          OR 127.0.0.0/8 OR 169.254.0.0/16 OR ::1 OR fc00::/7
        )

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
telegram_room_id: ${TELEGRAM_CHAT_ID}

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":rotating_light:"
slack_msg_color: "danger"

alert_subject: "[CRITICAL-URGENT] DDoS Attack Detected - {0}"
alert_subject_args:
  - destination.ip

alert_text_type: alert_text_only
alert_text_args:
  - destination.ip
  - num_matches
  - "@timestamp"

alert_text: |
  🆘 URGENT: DDoS ALERT
  ════════════════════════════════════
  Rule      : OPNsense - DDoS / Traffic Flood
  Risk Score: 90 / 100 | Severity: CRITICAL
  ────────────────────────────────────
  Target IP : {0}
  Traffic   : {1} requests/minute
  Timestamp : {2}
  ────────────────────────────────────
  MITRE ATT&CK: T1498 / T1499
  ────────────────────────────────────
  URGENT RESPONSE:
  1. Identify affected service — determine port/protocol
  2. Contact ISP / DDoS scrubbing service
  3. Apply firewall rate-limiting
  4. Evaluate BGP blackhole routing
  5. Notify NOC

realert:
  minutes: 15

exponential_realert:
  hours: 2