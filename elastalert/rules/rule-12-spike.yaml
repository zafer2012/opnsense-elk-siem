# ============================================================
# rule-12: Traffic Spike Detection
# Detection of sudden increases (spikes) in normal traffic volume.
# Objective: Should not trigger during routine daily traffic
# increases (false positives), but must trigger
# during sudden/abnormal volume surges (actual spikes).
# ============================================================
name: OPNsense - Traffic Spike Detection
type: spike
index: opnsense-syslog-*
es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

# The reference period and the comparison period are of the same length.
timeframe:
  minutes: 2

# The factor by which the number of events in the comparison window
# must exceed the number in the reference window to trigger an alarm (e.g., 3 = 200% increase)
spike_height: 3

# "up" = capture only increases, "down" = only decreases,
# "both" = capture both directions
spike_type: "up"

# For the spike calculation to be meaningful, there must be
# at least this many events in the reference window (filters out low-volume noise)
threshold_ref: 10

filter:
  - query:
      query_string:
        query: 'network.direction: "in"'

query_key:
  - destination.ip.keyword

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "youremailaddress"
from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
telegram_room_id: ${TELEGRAM_CHAT_ID}

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":rotating_light:"
slack_msg_color: "warning"

alert_subject: "[MEDIUM] Traffic Spike Detected - {0}"
alert_subject_args:
  - destination.ip

alert_text_type: alert_text_only
alert_text_args:
  - destination.ip
  - "@timestamp"
alert_text: |
  🟡 SOC ALERT: TRAFFIC SPIKE
  ════════════════════════════════════
  Rule      : OPNsense - Traffic Spike Detection
  Risk Score: 40 / 100 | Severity: MEDIUM
  ────────────────────────────────────
  Target IP : {0}
  Timestamp : {1}
  ────────────────────────────────────
  This alert indicates that a significant increase
  (spike_height >= 3x) in traffic volume to the target IP
  has been detected compared to the reference period.
  ────────────────────────────────────
  RESPONSE STEPS:
  1. Check the relevant source IPs
  2. Assess whether it is a DDoS attack, a scan, or a campaign
  3. Compare with normal business traffic (it could be a false positive)
realert:
  minutes: 10
