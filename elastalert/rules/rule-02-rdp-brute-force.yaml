# ============================================================
# rule-02: RDP Brute Force Attack
# ============================================================
name: OPNsense - RDP Brute Force Attack
type: frequency
index: opnsense-syslog-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}


num_events: 10
timeframe:
  minutes: 5

filter:
  - query:
      query_string:
        query: 'destination.port: 3389 AND NOT source.ip: ("10.0.0.0/8" OR "192.168.0.0/16")'

query_key:
  - source.ip.keyword
  - destination.ip.keyword

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
telegram_room_id: "${TELEGRAM_CHAT_ID}"


# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":rotating_light:"
slack_msg_color: "danger"

alert_subject: "[CRITICAL] RDP Brute Force Detected - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - num_matches
  - "@timestamp"

alert_text: |
  🔴 SOC ALERT: RDP BRUTE FORCE
  ════════════════════════════════════
  Rule      : OPNsense - RDP Brute Force Attack
  Risk Score: 85 / 100 | Severity: HIGH
  ────────────────────────────────────
  Source IP  : {0}
  Target IP  : {1}
  Port       : 3389 (RDP)
  Event Count: {2}
  Timestamp  : {3}
  ────────────────────────────────────
  MITRE ATT&CK: T1110 / T1021.001
  ────────────────────────────────────
  RESPONSE STEPS:
  1. Check AbuseIPDB, VirusTotal, Shodan
  2. Review event.action: allow records
  3. Check Windows Event ID 4625/4624 on target
  4. Move RDP behind VPN or enforce NLA

realert:
  minutes: 30