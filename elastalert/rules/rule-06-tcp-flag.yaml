name: OPNsense - Abnormal TCP Flag Combination
type: any
index: opnsense-syslog-*

es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}

filter:
  - bool:
      must:
        - query_string:
            query: 'tags: ("tcp_null_scan" OR "tcp_xmas_scan" OR "tcp_fin_scan" OR "tcp_syn_fin_anomaly" OR "tcp_rst_syn_anomaly") OR event.category: "intrusion_detection"'
      must_not:
        - term:
            source.ip: "193.255.0.0/16"

include:
  - source.ip
  - destination.ip
  - destination.port
  - tags
  - "@timestamp"

alert:
  - email
  - telegram
  - slack

# Email settings
email:
  - "yourname@yourcompany.com"

from_addr: elastalert@yourcompany.com
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_auth_file: /etc/elastalert/smtp_auth.yaml
smtp_ssl: false
smtp_starttls: true

# Telegram settings
telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
telegram_room_id: ${TELEGRAM_CHAT_ID}

# Slack settings
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#soc-alerts"
slack_username_override: "OPNsense SOC Bot"
slack_emoji_override: ":rotating_light:"
slack_msg_color: "warning"

alert_subject: "[HIGH] TCP Flag Anomaly Detected - {0}"
alert_subject_args:
  - source.ip

alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - destination.port
  - tags
  - "@timestamp"

alert_text: |
  🟠 SOC ALERT: TCP FLAG ANOMALY
  ════════════════════════════════════
  Rule      : Abnormal TCP Flag Combination
  Risk Score: 70 / 100 | Severity: HIGH
  ────────────────────────────────────
  Source IP  : {0}
  Target IP  : {1}
  Target Port: {2}
  Flag Type  : {3}
  Timestamp  : {4}
  ────────────────────────────────────
  MITRE ATT&CK: T1562 (Evasion) / T1046
  ────────────────────────────────────
  NULL Scan : Firewall evasion attempt
  XMAS Scan : FIN+URG+PSH — port discovery
  SYN+FIN   : RFC 9293 violation

realert:
  minutes: 60