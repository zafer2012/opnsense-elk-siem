# /etc/elastalert/config.yaml

# ── Elasticsearch Connection (TLS) ──────────────────────────────
es_host: localhost
es_port: 9200
use_ssl: true
verify_certs: true
ca_certs: /etc/elastalert/certs/ca.crt
es_username: ${ELASTIC_USER}
es_password: ${ELASTIC_PASS}


# ── Rule and Log Directories ───────────────────────────────────────
rules_folder: /etc/elastalert/rules
run_every:
  minutes: 1
buffer_time:
  minutes: 15

# ── ElastAlert Metadata Index ─────────────────────────────────
writeback_index: elastalert_status
alert_time_limit:
  days: 2

# ── Timing ───────────────────────────────────────────────────
scan_subdirectories: false

# ── Logging ─────────────────────────────────────────────────────
logging:
  version: 1
  formatters:
    logline:
      format: '%(asctime)s %(levelname)s %(name)s %(message)s'
  handlers:
    file:
      class: logging.handlers.RotatingFileHandler
      formatter: logline
      filename: /var/log/elastalert/elastalert.log
      maxBytes: 10485760
      backupCount: 5
  root:
    level: INFO
    handlers: [file]